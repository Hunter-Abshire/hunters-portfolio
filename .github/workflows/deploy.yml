name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "24"

jobs:
  deploy:
    name: Build and deploy (prod)
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Build site
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Test infra
        working-directory: infra
        run: |
          npm ci
          npm test

      - name: Show OIDC token claims
        # Prints only non-sensitive claims so a trust-policy mismatch is diagnosable from the log.
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, ref, environment, job_workflow_ref}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-hunters-portfolio-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK diff
        working-directory: infra
        run: npx cdk diff "HuntersPortfolio-Site-prod"

      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy "HuntersPortfolio-Site-prod" --require-approval never --outputs-file cdk-outputs.json

      - name: Summary
        working-directory: infra
        run: |
          {
            echo "### Deployed"
            echo
            jq -r 'to_entries[] | .value | to_entries[] | "- **\(.key)**: \(.value)"' cdk-outputs.json
          } >> "$GITHUB_STEP_SUMMARY"
